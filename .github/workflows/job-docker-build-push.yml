name: "Docker Build & Push"

on:
  workflow_call:
    inputs:
      ehrbase-version:
        type: string
        description: 'EHRbase version used for tagging'
      ehrbase-jar-artifact:
        type: string
        description: 'Archived ehrbase-jar artifact name'
        required: false

jobs:

  #
  # Build and pushes the EHRbase docker image for the given input jar
  #
  build-and-push:
    name: Build-And-Push
    runs-on: ubuntu-latest
    # Sanity check to ensure docker push only happen on dev/main/tag[v] refs
    if: ${{ github.ref == 'refs/heads/main'}} # || startsWith(github.ref, 'refs/heads/release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dockerfile

      - name: Download - Jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.ehrbase-jar-artifact }}
          path: ./application/target/

      # Azure registry login
      - name: Login into registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.MAIN_REGISTRY }}
          username: ${{ secrets.MAIN_REGISTRY_USERNAME }}
          password: ${{ secrets.MAIN_REGISTRY_PASSWORD }}

      # setup qemu for multi arch
      - name: Docker - Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker - Set up Buildx
        uses: docker/setup-buildx-action@v3

      # build the release multi arch image
      - name: Docker - Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64 
          push: true      # possible we could add linux/arm/v6,linux/arm/v7 as well?
          tags: |
            ${{ secrets.MAIN_REGISTRY }}/cortex-x/ehrbase:latest
            ${{ secrets.MAIN_REGISTRY }}/cortex-x/ehrbase:${{ inputs.ehrbase-version }}
          cache-from: type=registry,ref=${{ secrets.MAIN_REGISTRY }}/ehrbase:buildcache
          cache-to: type=inline
